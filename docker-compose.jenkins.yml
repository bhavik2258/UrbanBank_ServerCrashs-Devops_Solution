services:
  jenkins:
    build:
      context: .
      dockerfile: Dockerfile.jenkins
    container_name: jenkins-server
    user: root
    ports:
      - "8080:8080"
      - "50000:50000"
    environment:
      - JAVA_OPTS=-Djenkins.install.runSetupWizard=false
      - JENKINS_ADMIN_USERNAME=${JENKINS_ADMIN_USERNAME:-urbanbank-admin}
      - JENKINS_ADMIN_PASSWORD=${JENKINS_ADMIN_PASSWORD:-UrbanBankJenkins2026!}
    volumes:
      - jenkins_home:/var/jenkins_home

volumes:
  jenkins_home:
    name: jenkins_home
