apiVersion: v1
kind: ServiceAccount
metadata:
  name: backend
  namespace: urbanbank
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: backend-pod-recovery
  namespace: urbanbank
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: backend-pod-recovery
  namespace: urbanbank
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: backend-pod-recovery
subjects:
  - kind: ServiceAccount
    name: backend
    namespace: urbanbank
